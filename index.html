<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Формула — пространство для вашей мастерской. Расчёты смолы, себестоимость изделий, материалы, инструменты, склад и продажи в одной системе."
    />
    <title>Формула</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/logo-dark.svg?v=favicon-1" />
    <script>
      (() => {
        const key = 'resin-workshop-theme';
        const saved = localStorage.getItem(key);
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=category-management-1" />
    <link rel="stylesheet" href="./src/equipment.css?v=instance-control-1" />
    <link rel="stylesheet" href="./src/mold-workflow.css?v=mold-delete-1" />
    <link rel="stylesheet" href="./src/landing.css?v=landing-screens-1" />
    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/+esm",
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
        }
      }
    </script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/lucide@1.45.0/dist/umd/lucide.min.js"
    ></script>
  </head>
  <body>
    <canvas id="resin-scene" aria-hidden="true"></canvas>
    <div class="app-frame" id="app">
      <div class="boot-panel">
        <div class="brand-mark" aria-hidden="true">
          <img class="formula-logo formula-logo-dark" src="./assets/logo-dark.svg" alt="" />
          <img class="formula-logo formula-logo-light" src="./assets/logo-light.svg" alt="" />
        </div>
        <p>Загружаю рабочее пространство</p>
      </div>
    </div>
    <div class="toast-zone" id="toast-zone" aria-live="polite"></div>
    <noscript><p style="padding:32px;position:relative;z-index:3">Формула — пространство для вашей мастерской. Для просмотра страницы и входа в приложение включите JavaScript в браузере.</p></noscript>
    <script type="module" src="./src/main.js?v=landing-screens-1"></script>
  </body>
</html>
