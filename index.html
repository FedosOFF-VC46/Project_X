<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Внутреннее приложение для склада, изделий и расчета себестоимости эпоксидной смолы."
    />
    <title>Формула</title>
    <script>
      (() => {
        const key = 'resin-workshop-theme';
        const saved = localStorage.getItem(key);
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=formula-brand-1" />
    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/+esm",
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
        }
      }
    </script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/lucide@1.45.0/dist/umd/lucide.min.js"
    ></script>
  </head>
  <body>
    <canvas id="resin-scene" aria-hidden="true"></canvas>
    <div class="app-frame" id="app">
      <div class="boot-panel">
        <div class="brand-mark" aria-hidden="true">
          <svg class="formula-logo" viewBox="0 0 72 72" focusable="false">
            <path class="formula-logo-track is-muted" d="M15 23H42" />
            <path class="formula-logo-track is-muted" d="M15 36H42" />
            <path class="formula-logo-track is-muted" d="M15 49H42" />
            <path class="formula-logo-track is-live" d="M31 23H46" />
            <path class="formula-logo-track is-live" d="M31 36H46" />
            <path class="formula-logo-track is-live" d="M31 49H46" />
            <circle class="formula-logo-node" cx="31" cy="23" r="2.7" />
            <circle class="formula-logo-node" cx="31" cy="36" r="2.7" />
            <circle class="formula-logo-node" cx="31" cy="49" r="2.7" />
            <path class="formula-logo-result" d="M42 21L47 51L54 34L61 51L66 21" />
          </svg>
        </div>
        <p>Загружаю рабочее пространство</p>
      </div>
    </div>
    <div class="toast-zone" id="toast-zone" aria-live="polite"></div>
    <script type="module" src="./src/main.js?v=formula-brand-1"></script>
  </body>
</html>
